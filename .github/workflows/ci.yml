name: ci
on:
  push:
    branches:
      - "*"
    tags:
      # Full version
      - "[0-9]+.[0-9]+.[0-9]+"
      # Prerelease version
      - "[0-9]+.[0-9]+.[0-9]+-*"

  pull_request:
    branches:
      # Trigger on pull requests into main
      - main
    types: [ opened, synchronize ]

jobs:
  lint:
    name: Linting and Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run cargo clippy to pick up any errors
        run: cargo clippy --all-targets -- -Dwarnings
      - name: Check code is formatted
        run: cargo fmt -- --check

  build:
    name: Build package
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        rust:
          - stable
          - beta
        experimental: [false]
        include:
          - os: ubuntu-24.04
            rust: nightly
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
            toolchain: ${{ matrix.rust }}
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Run tests
        run: cargo test --all-features
      - name: Build binary
        run: cargo build --release
      - name: Build package
        run: cargo deb
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: ${{ matrix.rust == 'stable' }}
        with:
          name: stableartifacts-${{ matrix.os }}
          path: |
            target/release/blob
            target/debian/*.deb

  build-debian:
    name: Build Debian package
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessary for determining the package version correctly.
          fetch-depth: 0
      - name: Set up build environment
        run: docker compose -f compose.build.yml build buildenv
      - name: Build the package
        run: docker compose -f compose.build.yml run buildenv make
          deb-build-${{ matrix.arch }}
      - name: Lint the package
        run: docker compose -f compose.build.yml run buildenv make
          deb-lint-${{ matrix.arch }}
      - name: Test package installation
        if: ${{ matrix.arch == 'amd64' }} # The job runs on x64.
        run: docker compose -f compose.build.yml run buildenv make
          deb-install
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.arch }}
          path: |
            *.deb

  publish:
    name: Publish release artifact
    runs-on: ubuntu-latest
    # Conditioning based on secrets is not possible, see
    # https://github.com/actions/runner/issues/520. Since this is a fork, we
    # don't need to be clever about this, as we simply don't need it, ever.
    if: 'false'
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
            toolchain: stable
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.PUBLISH_SECRET }}

  publish-dry-run:
    name: Dry-run publish for non-release artifact
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Dry-run publish on non-tags
        run: cargo publish --dry-run
